name: Сообщить о проблеме
description: ValDoctor не помог, показал ошибку или повёл себя неожиданно
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версия ValDoctor
      description: Указана в первой строке отчёта и в названии релиза.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы нажали, что ожидали и что увидели.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Получилось ли войти в игру после исправления?
      options:
        - Исправление не применял
        - Да
        - Нет
        - Не проверял
  - type: textarea
    id: report
    attributes:
      label: Отчёт о проверке
      description: |
        В ValDoctor нажмите ⓘ в правом верхнем углу, затем «Скопировать отчёт».
        Issues видны всем. Перед отправкой просмотрите отчёт: в нём есть часовой пояс, IP-адреса из ответов вашего DNS, строки из файла hosts и данные сертификатов. Удалите то, чем не хотите делиться.
      render: text
  - type: markdown
    attributes:
      value: Не публикуйте логины, пароли, токены и другие личные данные. Об уязвимостях сообщайте приватно, через ссылку «Сообщить об уязвимости».
